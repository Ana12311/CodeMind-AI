# =============================================================
# CodeMind AI Backend — 配置示例（占位符）
#
# 使用方式：
#   1) 复制为 application.properties 并在本地填写真实值（勿提交），或
#   2) 通过环境变量注入（推荐，生产环境必须使用环境变量）
#
# 注意：本文件仅允许占位符，禁止填写真实密码/密钥。
# =============================================================

# ---- MySQL ----
DB_HOST=
DB_PORT=3306
DB_NAME=codemind
DB_USERNAME=
DB_PASSWORD=

# ---- Redis ----
REDIS_HOST=localhost
REDIS_PORT=6379
REDIS_DATABASE=0
REDIS_PASSWORD=

# ---- JWT ----
JWT_SECRET=

# ---- 内部服务鉴权（HMAC 签名密钥） ----
INTERNAL_SECRET=

# ---- AI 服务（FastAPI） ----
AI_SERVICE_URL=http://localhost:8000

# ---- 管理员初始化（应用启动时自动创建，勿填真实密码） ----
ADMIN_USERNAME=
ADMIN_PASSWORD=
