spring.application.name=CodeMind AI Backend

# ================= DataSource (MySQL) =================
# 全部由环境变量注入，不提供默认值（禁止硬编码/默认密码）
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ================= Redis =================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
# Redis 密码：开发环境 localhost 无密码可留空；生产环境必须设置
spring.data.redis.password=${REDIS_PASSWORD:}

# ================= MyBatis-Plus =================
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=assign_id
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ================= JWT =================
# 由环境变量注入，禁止默认/示例/硬编码 secret
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=7200000
jwt.refresh-token-expiration=604800000

# ================= 文件上传 =================
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ================= AI 服务（FastAPI） =================
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# ================= 内部服务鉴权（HMAC 签名密钥） =================
# 由环境变量注入，禁止默认值
internal.secret=${INTERNAL_SECRET}
