plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'CodeMind AI Backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web MVC
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // WebClient（调用 FastAPI AI 服务）
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    // Security + JWT
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    // 参数校验
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 数据访问（SB4 专用 starter）
    implementation 'com.baomidou:mybatis-plus-spring-boot4-starter:3.5.16'
    // 分页插件（3.5.9+ 拆包为独立依赖）
    implementation 'com.baomidou:mybatis-plus-jsqlparser:3.5.16'
    runtimeOnly 'com.mysql:mysql-connector-j'
    // 缓存
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // 接口文档：官方 starter 对 SB4 未完全适配，暂注释；确认可用版本后放开
    // implementation 'com.github.xiaoymin:knife4j-openapi3-jakarta-spring-boot-starter:4.5.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
